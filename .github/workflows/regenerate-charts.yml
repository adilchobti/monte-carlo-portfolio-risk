name: Regenerate portfolio charts

on:
  push:
    branches: [main]
    paths:
      - "src/monte_carlo.py"
      - "src/portfolio.py"
      - "data/market_prices.csv"
      - ".github/workflows/regenerate-charts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install chart dependencies
        run: python -m pip install --upgrade pip numpy pandas matplotlib seaborn

      - name: Generate Monte Carlo charts
        run: python src/monte_carlo.py

      - name: Generate correlation heatmap
        run: python src/portfolio.py

      - name: Commit updated chart images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/monte_carlo_paths.png results/monte_carlo_distribution.png results/correlation_heatmap.png
          if git diff --cached --quiet; then
            echo "No chart changes to commit."
          else
            git commit -m "Regenerate portfolio charts with dark theme"
            git push
          fi
